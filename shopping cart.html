<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Shopping Cart</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f4f4f4;
    }
    .product {
        background: #fff;
        padding: 15px;
        margin: 10px;
        border-radius: 5px;
        display: inline-block;
        width: 200px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .product img {
        width: 100%;
        height: auto;
    }
    .product h3 {
        margin: 10px 0;
    }
    .product button {
        background: #28a745;
        color: white;
        border: none;
        padding: 8px 12px;
        cursor: pointer;
        border-radius: 3px;
    }
    .product button:hover {
        background: #218838;
    }
    #cart {
        background: #fff;
        padding: 15px;
        margin-top: 20px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    table, th, td {
        border: 1px solid #ddd;
    }
    th, td {
        padding: 8px;
        text-align: center;
    }
    th {
        background: #f8f8f8;
    }
</style>
</head>
<body>

<h1>Shopping Cart Demo</h1>

<div class="product">
    <img src="https://via.placeholder.com/200" alt="Product 1">
    <h3>Product 1</h3>
    <p>Price: ₹500</p>
    <button onclick="addToCart('Product 1', 500)">Add to Cart</button>
</div>

<div class="product">
    <img src="https://via.placeholder.com/200" alt="Product 2">
    <h3>Product 2</h3>
    <p>Price: ₹750</p>
    <button onclick="addToCart('Product 2', 750)">Add to Cart</button>
</div>

<div id="cart">
    <h2>Your Cart</h2>
    <table id="cartTable">
        <thead>
            <tr>
                <th>Item</th>
                <th>Price (₹)</th>
                <th>Quantity</th>
                <th>Total (₹)</th>
                <th>Remove</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <h3 id="grandTotal">Grand Total: ₹0</h3>
</div>

<script>
    let cart = [];

    function addToCart(name, price) {
        const existingItem = cart.find(item => item.name === name);
        if (existingItem) {
            existingItem.quantity++;
        } else {
            cart.push({ name, price, quantity: 1 });
        }
        renderCart();
    }

    function removeFromCart(name) {
        cart = cart.filter(item => item.name !== name);
        renderCart();
    }

    function renderCart() {
        const tbody = document.querySelector("#cartTable tbody");
        tbody.innerHTML = "";
        let total = 0;

        cart.forEach(item => {
            const row = document.createElement("tr");
            const itemTotal = item.price * item.quantity;
            total += itemTotal;

            row.innerHTML = `
                <td>${item.name}</td>
                <td>${item.price}</td>
                <td>
                    <input type="number" min="1" value="${item.quantity}" 
                        onchange="updateQuantity('${item.name}', this.value)">
                </td>
                <td>${itemTotal}</td>
                <td><button onclick="removeFromCart('${item.name}')">X</button></td>
            `;
            tbody.appendChild(row);
        });

        document.getElementById("grandTotal").textContent = `Grand Total: ₹${total}`;
    }

    function updateQuantity(name, quantity) {
        const item = cart.find(item => item.name === name);
        if (item) {
            item.quantity = parseInt(quantity) || 1;
        }
        renderCart();
    }
</script>

</body>
</html>
